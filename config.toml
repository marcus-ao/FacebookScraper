# 实际选期受实测月份窗口及同渠道90分钟间隔约束，提交前再次读取远端占用。
times = ["10:00", "17:00"]

[pipeline]
# ---- 流水线编排与自治级别。五阶段现状见 docs/REQUIREMENTS.md 第 10 节 ----
# 2026-09-01 起由 pipeline run 全量消费。manual 只对账；assisted 会在每个
# 付费请求前后按真实 usage 检查预算，并生成待确认项，但不会自行打开发布浏览器。

# 自治级别。**不要在"全手动"和"全自动"之间二选一** ——
# 这个项目的风险是不对称的：抓取被封不可恢复、发布不可回滚，
# 而翻译和调图错了只是重跑。所以按阶段分别放开。
#
#   manual      只做本地对账，不触发增量/翻译/调图/发布
#   assisted    在既有激活边界、付费许可与预算内处理新帖；逐篇人工审校和选期
#   supervised / autonomous  保留名称以识别旧配置，本轮不开放无人审核发布
#
# 固定路径：先通过 G8 并 activate，再切 assisted；计划任务仍由用户显式安装。
# supervised / autonomous 本轮故意失败闭合。
# ⚠️ 不建议直接跳到 autonomous。理由和 [delta] 那七条缓解措施一样：
#    这类风险的反馈是延迟的，而且第一次通常就是最贵的那次。
autonomy = "assisted"

# ---- 业务长时间未成功的本机告警 ----
# core/integrity.py 检查的是「**账号**有没有在发新帖」，
# check-alive 根据业务成功记录判断；常驻进程状态另行展示。
# 电脑断电时本机任务也不能告警，需要 [heartbeat] 外部服务检测缺席。
#
# 超过这个天数没有一次成功的 pipeline run 就告警。
# 3 天：留出周末合盖不开机的余量，又不至于让故障潜伏一周。
dead_man_days = 3

# ---- 成本闸 ----
# 自动化意味着没人盯着，所以预算必须是硬的：超了停下来问，不是继续跑。
# 按近 90 天实测节奏（5.2 篇/周、11.9 图/周）估：
#   翻译 ≈ US$1/月 ＋ 图片 high 档 ≈ US$33/月 ＝ 约 US$34/月。
# 设 60 是给新品发布、活动周这类波动留余量。
#
# ⚠️ **账单必须按真实 usage 外推，不许按字符数或张数猜。**
# CR-40 的教训：F 组按字符估给出 US$1.08–5.41，真实是 US$23.73，
# 低估一个数量级 —— 漏掉了主导项。两个阶段的真实 usage 都逐条写在
# paid_requests.jsonl 里；旧业务 usage 只用于兼容历史统计，不能隐藏新失败请求费用。
monthly_budget_usd = 60
daily_budget_usd = 5

[paths]
archive = "archive"
state = "state"
# 审校台静态构建目录，相对于项目根目录。
web_dist = "web/ui/dist"

[review]
# 「挂起」默认到期几个上海工作日后回到待审列表（按周一至周五数，不猜调休）。
# 3 是定下来的：比「明天」长，够她真的去把事情问清楚；比「一周」短，
# 不至于忘了这回事 —— 带到期提醒的挂起不是死信箱，它会自己回来。
# 这是 REQUIREMENTS 第 5.3 节二分里的「运营」类参数，可以改；
# API 与界面中的默认值只是兜底，
# 真正生效的是这里。
snooze_default_days = 3

[feishu]
# 管理员批准自建应用、配置两个接收组及可访问的审校台地址后再启用。
# 密钥仅从 FEISHU_APP_ID / FEISHU_APP_SECRET 环境变量读取。
enabled = false
base_url = ""
recipients = []
technical_recipients = []
# 终态记录保留 30 天后归档；未确认投递和待发送内容继续保留。
keep_delivered_days = 30

[mirror]
# 只向已授权的云盘目录创建不可覆盖快照；绝不从云盘回填本地。
# 使用 FEISHU_APP_ID / FEISHU_APP_SECRET；获得目录写入权限后再启用。
enabled = false
root_folder_token = ""
mirror_state = true
state_interval_minutes = 60

[heartbeat]
# 外部服务负责发现缺席并告警；地址中的匿名凭据只放环境变量。
enabled = false
url_env = "HEARTBEAT_URL"
interval_minutes = 5
timeout_seconds = 3
# 模型、采样和投递已移出监测主循环。此阈值衡量外部心跳缺席，
# 不用它冒充内容处理成功，也不把单篇预算当作整批耗时。
stale_after_minutes = 45

[calendar]
# 核验发布浏览器的完整月历读取后再启用；刷新争用同一把发布锁，繁忙时跳过。
enabled = false
refresh_minutes = 60

[network_evidence]
# IPINFO_TOKEN 仅从环境变量读取。Lite 提供 IP/ASN，类型未知；Core 需相应服务权限。
enabled = false
tier = "lite"
interval_minutes = 60
history_size = 20
timeout_seconds = 3
