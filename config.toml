[publish.trusted_owners]
# 允许进入付费处理的来源；第三方作者须确认授权。
facebook = ["neakasaofficial"]
instagram = ["neakasa.tech", "neakasa.global"]

[publish.schedule_rule]
times = ["16:00", "23:00"]  # 北京默认候选（≈柏林 10:00/17:00）；可选其它合法时刻。

[pipeline]
autonomy = "assisted"  # manual 仅对账；assisted 按许可和预算处理，逐篇人工审校。
dead_man_days = 3  # 业务连续未成功的告警阈值，不代表进程存活。
monthly_budget_usd = 60  # 按付费请求账本计费，超预算停止。
daily_budget_usd = 5

[paths]
archive = "archive"
state = "state"
web_dist = "web/ui/dist"  # 相对于项目根目录。

[review]
snooze_default_days = 3  # 上海工作日，按周一至周五计。

[feishu]
# 同一业务群按 detect/capture/publish/alert 四个阶段角色投递。
# 四个机器人地址与各自签名密钥只在本机 .env（见 MANUAL_STEPS 第 2 节）。
# FEISHU_APP_ID / FEISHU_APP_SECRET 现在只给 [mirror] 的云盘用，不参与发消息。
# ⛔ enabled 已开：服务机第一次加载这份配置之前，先只读数 capture_state.json 里
# acknowledged=false 的事件；下一轮维护会按扫描把它们一次性入队。
enabled = true
# 非受管卡片里的审校台链接。⚠️ 它不绑定监听地址，git pull / 更新运行包也不会改
# 服务机 control/host.json。受管实例读 host.json 的 public_base_url
#（网络配置 ops/service-machine.network.json）。用 scripts/update_service_address.bat 同步两处入口。
# URL 不含凭据、查询参数或锚点。
base_url = "http://10.66.4.9:8765"
scan_reports = true  # 每轮的发现与落档卡分别由检测、爬取机器人发送；无新帖不推。
keep_delivered_days = 30  # 终态保留期；未确认投递继续保留。

[mirror]
# 本地到云盘的单向版本镜像。
# ⛔ enabled = false 是 2026-09-15 的延期决定（REQUIREMENTS §9），不是没做完：
# 云盘要企业自建应用的 AppSecret，本轮先跑本地与 SQLite。开启步骤见 MANUAL_STEPS 7.1。
# 代价是本轮没有异地备份，而 state/published.jsonl 不可重建，须由人定期外拷。
enabled = false
root_folder_token = "TsQef8msClS2i6dlzpfcpfn6nAc"
mirror_state = true
state_interval_minutes = 60

[storage.product_aliases]
# 自动分类：完整型号 hashtag 优先，正文补充；键为统一产品名。
M1 = ["NeakasaM1"]
P1 = []
"P1 Pro" = ["P1Pro", "NeakasaP1Pro"]
P2 = []
S1 = []
"S1 Pro" = ["S1Pro", "NeakasaS1Pro"]
F1 = ["NeakasaF1"]
N3 = []
Magic1 = ["NeakasaMagic1"]
Riko = ["RIKO"]

[heartbeat]
# 开关已开。HEARTBEAT_URL 是外部看门狗的 HTTPS ping 地址（healthchecks.io 一类），
# 不是审校台 http://10.66.4.9:8765。没配时 tick 记 missing_url，不崩进程。
enabled = true
url_env = "HEARTBEAT_URL"  # 心跳地址的环境变量名；缺席告警由外部服务负责。URL 不写入本文件。
interval_minutes = 5
timeout_seconds = 3
stale_after_minutes = 45  # 外部心跳缺席阈值，不代表内容处理成功。

[calendar]
# 刷新前核验发布会话，读取与发布共用锁。
enabled = false
refresh_minutes = 60
publish_grace_minutes = 60  # 排期时刻过后多久仍未观测到公开就告警；不据此断定未发布。
