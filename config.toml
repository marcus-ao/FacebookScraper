[publish.trusted_owners]
# 目标账号自己的原创允许自动进入付费阶段；合作作者默认一律待人工确认。
#
# ✅ 2026-09-01：用户确认 **@neakasa.global 的二次使用授权已覆盖**，加入白名单。
#    实测这一条覆盖最近 90 天全部 12 篇被 unknown_collaborator 拦下的帖。
#
# ⛔ **不要顺手把第三方创作者（宠物 UGC 账号）也加进来。**
#    归档里有 229 篇原作者是第三方创作者，那类每篇都该有人看一眼 ——
#    这道闸就是为它们留的。加进来等于把闸拆了。
