[chrome]
exe = ""  # 留空自动探测 Chrome。
profile_dir = "~/.fbscraper-chrome"  # 回填会话；与监测、发布隔离。
debug_port = 9222

[detect]
profile_dir = "~/.fbscraper-detect"  # 监测会话，需人工登录。
port = 9224

[targets]
facebook = "neakasaofficial"
instagram = "neakasa.global"

[backfill]
max_session_seconds = 1800

[delta]
on_duty_window = ["08:00", "19:00"]  # 上海时间，同时用于通知静默窗口。
on_duty_interval_min = 60
off_duty_interval_min = 180
jitter_ratio = 0.25
max_scrolls = 0  # 常规扫描深度；0 表示只取首屏。
reconcile_at = "07:00"  # 上海时间；晨间深扫。
reconcile_jitter_min = 30
reconcile_scrolls = 3
reconcile_max_session_seconds = 90  # 单个平台扫描上限。
processing_budget_min = 25  # 整批处理预算下限，另计两个平台扫描。
request_gap_seconds = 8
first_screen_seconds = 6
first_screen_timeout_seconds = 18  # FB 未见目标帖时被动等候上限，从导航开始计时，仍受整轮预算限制。
max_session_seconds = 300
failure_budget = 3  # 连续失败次数，达到后停止。
autostart_chrome = true
keep_captures_days = 7  # 仅清理增量转储，回填转储保留。
min_own_posts = 3

[hashtags]
# ⛔ enabled = false 是 2026-09-15 的业务决定（REQUIREMENTS §9），不是没做完：
# 本轮标签只由业务手工选取与编辑。三个采集器（Trends / IG 累计 / 德语同类账号）都已离线
# 验过，代码保留不删；恢复访问并给出同类账号名单后改回 true 即可。
# 关闭时连德语候选词那次付费调用也不发，见 pipeline/hashtag_suggestions.suggestions_enabled。
enabled = false
peer_accounts = []  # 德国同类账号；空名单跳过采样。
refresh_days = 7
max_candidate_tags = 20
max_peer_accounts = 10

[integrity]
alert_after_quiet_days = { facebook = 7, instagram = 10 }  # 连续零新增告警；两平台分别统计。
gap_flag_days = { facebook = 5, instagram = 6 }  # 相邻源帖超过此间隔时提示疑似缺口。

[translate]
provider = "deepseek"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"  # 环境变量名，非密钥。
model = "deepseek-flash"  # 当前 Flash 调用名；deepseek-v4-flash 已退役并临时路由到新版。
timeout_seconds = 120
max_retries = 2  # 仅无付费账本的 SDK 客户端使用；受统一账本管理的调用固定为 0。
request_gap_seconds = 1.0
failure_budget = 3  # 连续失败次数，达到后停止本批。
reasoning_effort = "high"  # low | high | max；显式开启 thinking。
cost_rates_usd_per_million = { input = 1.32, cache_read = 0.044, output = 3.96 }  # 保守估算上界，实际费用以供应商账单为准。
style_examples = 6  # 从源账号取用的文案示例数。
tone = "品牌口吻保持简洁直接，避免夸张营销词；控制长度。"
address_form = "du"  # du | Sie
gender_style = "neutral"  # neutral | colon | generic
anglicism_policy = "moderate"  # moderate | minimal | keep

# ⚠️ TOML 规则：本子表必须是 [translate] 的最后一段，它下面的键都会归给 glossary。[translate] 的新标量键加在这一行**之前**。
[translate.glossary]
# 英文术语到德文的统一译法；变更翻译规则时更新 PROMPT_VERSION。
"free shipping"             = "kostenloser Versand"
"grooming kit"              = "Haustierpflege-Set"
"litter box"                = "Katzentoilette"
"litter mat"                = "Streumatte"
"odor control"              = "Geruchskontrolle"
"open-top litter box"       = "Katzentoilette mit offenem Design"
"pet grooming"              = "Fellpflege"
"pet grooming kit"          = "Haustierpflege-Set"
"self-cleaning litter box"  = "selbstreinigende Katzentoilette"
"suction power"             = "Saugleistung"
"vacuum steamer"            = "Dampfglätter mit Saugfunktion"
"waste bag"                 = "Müllbeutel"
"wet food"                  = "Nassfutter"

[image]
max_refine_per_media = 3  # 每张图片可受理的人工优化次数上限。
provider = "inferera"
base_url = "https://api.inferera.com/v1"
api_key_env = "IMAGE_API_KEY"  # 环境变量名，非密钥。
model = "gpt-image-2"  # 可选 gpt-image-2.5-flare / gpt-image-2.5-sunburst；切换核验见 MANUAL_STEPS §5.1。

quality = "high"  # low | medium | high；不使用 auto。
output_format = "jpeg"
timeout_seconds = 720
max_retries = 2  # 仅无付费账本的 SDK 客户端使用；受统一账本管理的调用固定为 0。
request_gap_seconds = 2.0
incremental_since = "2026-08-31T00:00:00Z"  # 默认处理边界；补历史须显式确认费用。
# 按模型分表的 token 估算费率；来源见 MANUAL_STEPS §5.1，实际费用以网关账单为准。
cost_rates_usd_per_million = { "gpt-image-2" = { text_input = 5.0, image_input = 8.0, image_output = 30.0 }, "gpt-image-2.5-flare" = { text_input = 5.0, image_input = 8.0, image_output = 30.0 }, "gpt-image-2.5-sunburst" = { text_input = 5.0, image_input = 8.0, image_output = 30.0 } }
dhash_max_distance = -1  # -1 只记录不拦截；启用阈值前须用业务样本标定，不许拍脑袋。
aspect_drift_warn_percent = 2.0  # 宽高比偏差百分比；仅告警。按 818 张真实归档标定过。
scale_warn_factor = 1.25  # 线性放大倍数；仅告警。
change_ratio_warn = -1  # 图内改动像素占比的告警线；-1 关闭。同 dhash_max_distance，启用前须用真实产出标定。
# 发布侧画幅窗口 [低, 高]。来自 2026-09-01 历史观察（4:5 ~ 1.91:1），该 probe dump 已删，所以它只
# 重排 legal_size 的候选、从不拒绝；有已签字 probe dump 时以 probe 为准。不改原图本来就在带外的比值。
preferred_aspect_band = [0.8, 1.91]
failure_budget = 3  # 连续失败次数，达到后停止本批。

# ⚠️ 同上：本子表必须是 [image] 的最后一段，[image] 的新标量键加在这一行之前。
[image.keep_verbatim]
# 图内逐字符保留；删除条目前须确认业务影响。
promo_codes = ["P1MMCG", "NEAKACG", "SOCIAL05", "Q11", "PH5RIKO"]
brands = ["Neakasa", "NEAKASA", "Neabot"]
models = ["M1", "P1", "P1 Pro", "P1Pro", "P2", "S1", "S1 Pro", "S1Pro",
          "F1", "N3", "Magic1", "Riko", "RIKO",
          "NeakasaM1", "NeakasaP1Pro", "NeakasaF1", "NeakasaS1Pro", "NeakasaMagic1"]
events = ["CES", "IFA", "CES2025", "CES2026", "IFA2025", "IFA2026"]
marks = ["CE", "FCC", "RoHS", "UL", "MSRP", "®", "™", "©"]

[publish]
ig_bio_url = ""  # 德国站聚合页，只读展示；不自动修改 bio。
min_channel_gap_min = 90  # 同渠道排期间隔；冲突拒绝，不自动顺延。
facebook_page_name = "Neakasa Deutschland"  # 主页显示名，用于 Business Suite 账号核验。
facebook_page_slug = ""  # 主页 URL 账号名段；可留空，不用于账号核验。
instagram_account = "neakasa.de"
profile_dir = "~/.fbscraper-publish"  # 发布会话；与回填、监测隔离。
debug_port = 9223
timezone = "Asia/Shanghai"  # 运营选择发布时刻用的时区；决定她看到和填写的墙上时刻。与下面的 ui_timezone 是两件事。
ui_constraints_verified = true  # 已接受下方控件录制；不要求逐项测量 UI 边界。
ui_probe_dump = "publish_probe_20260920_100921_378853.json"  # state/ 下的控件证据，须保留同名截图目录。
ui_timezone = "Asia/Shanghai"  # 发布服务器及 Business Suite 设备时区，用于日期时间填写和回读。
ui_timeout_seconds = 30
require_confirmation = true  # 提交前确认最终内容。
require_all_media_de = true  # 缺德语图时拒绝发布。

# ⚠️ 以下三个子表必须留在 [publish] 末尾。[publish] 的新标量键加在这一行之前，写到子表头之后会静默归给子表。
[publish.link_map]

