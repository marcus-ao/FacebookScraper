name: Windows release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Configure isolated test directories
        run: |
          $browserCachePath = Join-Path $env:RUNNER_TEMP 'fbscraper-playwright'
          "PLAYWRIGHT_BROWSERS_PATH=$browserCachePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # The account TEMP can use an 8.3 alias; fixtures require canonical paths.
          $testTempPath = Join-Path $env:RUNNER_TEMP 'fbscraper-test-temp'
          New-Item -ItemType Directory -Path $testTempPath -Force | Out-Null
          foreach ($name in @('TMPDIR', 'TEMP', 'TMP')) {
            "$name=$testTempPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.9'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - name: Download hash-locked Windows wheels
        run: >-
          python -m pip download --require-hashes --only-binary=:all:
          --platform win_amd64 --python-version 3.12 --implementation cp --abi cp312
          --dest state/release-wheelhouse -r requirements.lock
      - name: Install exact runtime dependencies
        run: >-
          python -m pip install --no-index --find-links state/release-wheelhouse
          --require-hashes --only-binary=:all: -r requirements.lock
      - name: Install isolated browser
        run: python -m playwright install chromium
      - name: Install frontend dependencies
        run: npm ci --prefix web/ui
      - name: Frontend tests
        run: npm --prefix web/ui test
      - name: Record browser and runtime identity
        run: |
          $browser = python -c "from playwright.sync_api import sync_playwright; exec('with sync_playwright() as p:\n    browser = p.chromium.launch(headless=True)\n    print(p.chromium.executable_path)\n    browser.close()')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "FBSCRAPER_TEST_CHROME_EXE=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $runtimeId = python -m deployment.release fingerprint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VITE_FBSCRAPER_RUNTIME_ID=$runtimeId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build frontend
        run: npm --prefix web/ui run build
      - name: All isolated offline scripts including browser workflows
        run: python -m tools.test_offline
      - name: Browser stages and static cutover
        run: |
          python tests/browser_regression.py --stage ALL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/cutover_rehearsal.py --out state/cutover-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/browser_deployment.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package verified commit
        run: |
          python -c "import os; from pathlib import Path; from deployment.release import runtime_fingerprint; assert runtime_fingerprint(Path.cwd()) == os.environ['VITE_FBSCRAPER_RUNTIME_ID'], 'Runtime inputs changed after frontend build'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m deployment.release build --output state/release-artifact --sha $env:GITHUB_SHA --repository $env:GITHUB_REPOSITORY --run-id $env:GITHUB_RUN_ID --run-attempt $env:GITHUB_RUN_ATTEMPT --wheelhouse state/release-wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload deployable payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fbscraper-windows
          path: state/release-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failed test evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fbscraper-test-evidence
          path: |
            state/offline-validation-*/
            state/offline-browser-*/
            state/ui-regression/
            state/cutover-release.json
            state/deployment-implementation/browser-deployment*
          if-no-files-found: ignore
          retention-days: 14
