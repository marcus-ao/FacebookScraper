# Copy to config.local.toml to bind local data and runtime paths.
[paths]
archive = "D:/path/to/existing/project/archive"
state = "D:/path/to/existing/project/state"

[runtime]
python = "D:/path/to/existing/project/.venv/Scripts/python.exe"
env_file = "D:/path/to/existing/project/.env"
backup_manifest = "D:/path/to/verified/manifest.json"
